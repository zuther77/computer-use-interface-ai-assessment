[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bankops"
version = "0.1.0"
description = "Computer-use automation system: LLM-driven discovery, artifact recording, and deterministic replay against a self-hosted ParaBank instance."
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.40",
    "openai>=1.30",
    "pydantic>=2.5",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["bankops*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
