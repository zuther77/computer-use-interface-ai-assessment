<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Tools Fixture — Page One</title>
</head>
<body>
  <h1>Tools Page One</h1>
  <label for="amount">Amount</label>
  <input id="amount" name="amount" type="text">
  <label for="mode">Mode</label>
  <select id="mode" name="mode">
    <option value="fast">Fast Shipping</option>
    <option value="slow">Slow Shipping</option>
  </select>
  <button id="apply" onclick="document.getElementById('out').textContent='applied'">Apply</button>
  <a id="next" href="tools_page2.html">Go to page two</a>
  <div id="out"></div>
</body>
</html>
